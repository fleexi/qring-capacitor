<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wristband Example</title><style>body{font:16px system-ui;margin:0;padding:env(safe-area-inset-top) 16px 24px;background:#f4f6f8;color:#17252c}button,input,select{font:inherit;padding:10px;margin:4px}button{border:1px solid #adc0c8;border-radius:8px;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17252c;color:#dcf5ed;padding:12px;border-radius:8px}section{margin:16px 0}label{display:inline-block}</style></head><body><h1>Wristband SDK</h1><p>Esempio per il collaudo del plugin. Scegliere il tipo reale del dispositivo.</p><section><select id="kind"><option value="band">Band</option><option value="watch">Watch</option><option value="ring">Ring</option></select><button data-action="initialize">Inizializza</button><button data-action="permissions">Permessi</button><button data-action="scan">Scansiona</button><div id="devices"></div><input id="device" placeholder="ID dispositivo"><button data-action="connect">Connetti</button><button data-action="state">Stato</button><button data-action="capabilities">Funzionalità</button><button data-action="battery">Batteria</button></section><section><select id="metric"><option value="heartRate">Cuore</option><option value="bloodOxygen">SpO₂</option><option value="hrv">HRV</option><option value="stress">Stress</option><option value="steps">Passi</option><option value="sleep">Sonno</option></select><button data-action="history">Storico 7 giorni</button><button data-action="settings">Leggi impostazioni</button><label><input id="enabled" type="checkbox">Abilitata</label><input id="interval" type="number" min="1" placeholder="Intervallo minuti (opzionale)"><button data-action="write">Scrivi impostazioni</button></section><section><button data-action="disconnect">Disconnetti</button><button data-action="reconnect">Riconnetti</button><button data-action="forget">Dimentica</button></section><pre id="log">Pronto.</pre><script type="module" src="main.js"></script></body></html>
